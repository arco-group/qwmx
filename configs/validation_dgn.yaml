# Hyperparameter search on the DisGeNET validation diseases (75 of 374).
# Each method lists the blocks of values that were evaluated; a block is the
# full product of its lists. The configuration with the highest mean AP is
# selected (configs/opentargets.yaml, configs/temporal_dgn.yaml).
dataset: dgn
split: validation
methods:
  QW-M-TA:
    - {method: QW-M, init: coherent, batch: 128, delta: [0.0, 0.1, 0.25, 0.5],
       gamma: [0.0, 0.5, 1.0], T: [2, 4, 8, 16, 32, 64, 128, 256]}
    - {method: QW-M, init: coherent, batch: 128, delta: [0.0, 0.1], gamma: [0.0],
       T: [256, 512, 1024]}
  QW-M-ST:
    - {method: QW-M, init: coherent, delta: [0.0, 0.1, 0.25, 0.5], gamma: [0.0, 0.25, 1.0],
       t: [2, 4, 8, 16, 32, 64, 128]}
    - {method: QW-M, init: coherent, delta: [0.0, 0.05, 0.1], gamma: [0.0],
       t: [128, 256, 512, 1024]}
  QW-M-RC:
    - {method: QW-M, norm: raw, scale_coupling: true, init: incoherent,
       delta: [0.01, 0.03, 0.1, 0.3], gamma: [2.0, 5.0, 10.0], t: [0.02, 0.05, 0.1, 0.2, 0.45]}
    - {method: QW-M, norm: raw, scale_coupling: true, init: incoherent,
       delta: [0.1, 0.3], gamma: [10.0, 20.0, 50.0], t: [0.2, 0.45, 0.8, 1.5]}
  DK-M: {method: DK-M, delta: [0.0, 0.1, 0.25, 0.5, 0.75], t: [0.25, 0.5, 1, 2, 4, 8, 16, 32]}
  RWR-M: {method: RWR-M, delta: [0.1, 0.25, 0.5, 0.75, 0.9], r: [0.3, 0.5, 0.7, 0.9]}
  QA:
    - {method: QA, graph: [PPI, PATH, COEX, MERGED], gamma: [0.0, 1.0, 2.0, 5.0, 10.0],
       t: [0.1, 0.2, 0.3, 0.45, 0.6, 0.8, 1.0]}
    - {method: QA, graph: [PPI, PATH, COEX, MERGED], gamma: [0.0, 1.0], t: [1.0, 1.5, 2.0, 3.0]}
  DK: {method: DK, graph: [PPI, PATH, COEX, MERGED], t: [0.05, 0.1, 0.2, 0.3, 0.5, 1.0]}
  RWR: {method: RWR, graph: [PPI, PATH, COEX, MERGED], r: [0.2, 0.4, 0.6, 0.8]}
  NEI: {method: NEI, graph: MERGED}
  Degree: {method: Degree, graph: MERGED}
