[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qwmx"
version = "1.0.0"
description = "Time-averaged quantum walks for disease gene prioritization on multiplex biological networks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matteo Tortora" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
